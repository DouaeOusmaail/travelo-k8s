apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: travelo-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: travelo.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: travelo-frontend
                port:
                  number: 80
