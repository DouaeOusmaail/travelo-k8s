apiVersion: v1
kind: ServiceAccount
metadata:
  name: travelo-viewer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: travelo-viewer-role
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: travelo-viewer-binding
subjects:
  - kind: ServiceAccount
    name: travelo-viewer
    namespace: travelo
roleRef:
  kind: Role
  name: travelo-viewer-role
  apiGroup: rbac.authorization.k8s.io
